name: Notify about Coverage


on:
  pull_request:
  push:
    branches:
      - main

jobs:
  calc_coverage:
    runs-on: ubuntu-latest
    outputs:
      COV_PERCENT: ${{ steps.save-coverage.outputs.COV_PERCENT }}
    defaults:
      run:
        # needed so micromamba activation from setup-micromamba takes effect
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: environment.yml
          # pin Python from the matrix; other deps (incl. CPU pytorch) come from environment.yml
          create-args: >-
            python=3.14 coverage
          cache-environment: true

      - name: Build and install cyten
        # build deps (pybind11, scikit-build-core, cmake, pytorch, ...) come from environment.yml
        # --no-build-isolation avoids pip pulling a CUDA torch wheel that needs the CUDA toolkit
        run: |
          pip install --no-build-isolation -e ".[test]"
        working-directory: ./cyten

      - name: Build and install tenpy
        run: |
          python -m pip install -e ".[test]"

      - name: Run pytest with coverage
        # pytest configuration in pyproject.toml
        # Note: This runs in the repo root directory, which contains the uncompiled tenpy package.
        #       To use the version we just installed, it is important to run `coverage`
        #       instead of `python -m coverage`.
        # Note: only cover tenpy tests, not cyten!
        run: |
          coverage run -m pytest tests
          coverage report -m --skip-covered --sort=miss
          coverage json

      - name: save coverage
        id: save-coverage
        run: echo "COV_PERCENT=$(jq .totals.percent_covered coverage.json | xargs printf "%.0f")" >> $GITHUB_OUTPUT

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: coverage.json
          if-no-files-found: error

  comment:
    needs: [calc_coverage]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: create PR comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: mshick/add-pr-comment@v3
        with:
          message: |
            Thank you for working on this Pull request!
            Here are some stats on your progress.
            The overall test coverage on TenPy, including the changes within this PR, is now ${{ needs.calc_coverage.outputs.COV_PERCENT }}%.
      - name: Create badge
        # Only on pushes to the main branch
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.JAKOB_UNFRIED_GIST_TOKEN }}
          gistID: 9e2e197d6a2e6e2c9440b2c0eda04d5c
          filename: tenpy_coverage_badge.json
          label: Code Coverage
          message: ${{ env.COV_PERCENT }}%
          minColorRange: 50
          maxColorRange: 100
          valColorRange: ${{ env.COV_PERCENT }}
