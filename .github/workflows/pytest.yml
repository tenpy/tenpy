name: Run Pytest
# Run the test suite using pytest

# Note: The doctests (pieces of test in the docstrings) are run by doc-build.yml

on:
  # pushes to main
  push:
    branches:
      - main
      - v2_main
  # PRs
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]


jobs:
  build:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    env:
      # make pytest output in color
      PY_COLORS: 1
    defaults:
      run:
        # needed so micromamba activation from setup-micromamba takes effect
        shell: bash -el {0}
    strategy:
      matrix:
        # reminder: when changing python versions, also look at the other workflows!
        #           also check for new versions of pypa/cibuildwheel used in publish workflow!
        python-version: ["3.14"]

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: true  # not recursive: for now private submodules within cyten

    - name: Set up micromamba
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: environment.yml
        # pin Python from the matrix; other deps (incl. CPU pytorch) come from environment.yml
        create-args: >-
          python=${{ matrix.python-version }}
        cache-environment: true

    - name: Build and install cyten
      # build deps (pybind11, scikit-build-core, cmake, pytorch, ...) come from environment.yml
      # --no-build-isolation avoids pip pulling a CUDA torch wheel that needs the CUDA toolkit
      run: |
        pip install --no-build-isolation -e ".[test]"
      working-directory: ./cyten

    - name: Build and install tenpy
      run: |
        python -m pip install -e ".[test]"

    - name: Show tenpy config
      working-directory: ..
      run: |
        python -c "import tenpy; tenpy.show_config()"

    - name: Run pytest
      working-directory: tests
      run: pytest
